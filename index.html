<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="./manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-image: url('https://skoop-signage-storage-v2-dev.s3.amazonaws.com/HlRB6h0_VE3fNWcQsNqOqhNNIOKDLekmGS3y1L8Qn8c=_skoop_media_7c72a532f6360e29e3f010659aa0b2a7_191213597.webp');
      background-size: cover; /* Scale the image to cover the entire element */
      background-position: center; /* Center the image */
      background-repeat: no-repeat; /* Do not repeat the image */
      height: 100vh; /* Ensure body takes full viewport height */
      width: 100vw; /* Ensure body takes full viewport width */
      display: flex; /* Use flexbox for centering content */
      justify-content: center; /* Center content horizontally */
      align-items: center; /* Center content vertically */
      color: white; /* Set text color to white for better contrast against a background image */
      font-family: sans-serif; /* Use a common sans-serif font */
    }
    h1 {
      text-align: center;
      /* Further styling for the heading if needed, e.g., shadow */
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <h1>Hello World</h1>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js')
          .then(function (reg) { console.log('[PWA] SW registered:', reg.scope); })
          .catch(function (err) { console.warn('[PWA] SW registration failed:', err); });
      });
    }
  </script>
</body>
</html>
