<!DOCTYPE html>
<html lang="en">
<head>
  <!-- skoop-live-runtime -->
  <script src="./skoop-live.js"></script>
  <link rel="manifest" href="./manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    body {
        color: white; /* Set text color to white for better contrast against a background image */
      font-family: sans-serif; /* Use a common sans-serif font */
    }
    h1 {
      text-align: center;
      /* Further styling for the heading if needed, e.g., shadow */
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <h1>Hello World</h1>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js')
          .then(function (reg) { console.log('[PWA] SW registered:', reg.scope); })
          .catch(function (err) { console.warn('[PWA] SW registration failed:', err); });
      });
    }
  </script>
</body>
</html>
